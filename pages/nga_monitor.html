<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGA 大佬监控</title>
<style>
 :root{
   --bg:#06101c; --bg2:#0a1626; --line:rgba(125,154,211,0.18); --line-strong:rgba(125,154,211,0.32);
   --text:#e8f1ff; --muted:#90a7cf;
   --blue:#5fa8ff; --cyan:#39d9ff; --green:#2bd67b; --amber:#ffb85c; --red:#ff6b6b;
 }
 *{box-sizing:border-box}
 html,body{margin:0;height:100%}
 body{
   color:var(--text);
   font-family:"Inter","PingFang SC","Microsoft YaHei",sans-serif;
   background:linear-gradient(180deg,#06101c 0%,#08111f 44%,#091522 100%);
   min-height:100vh; padding:18px;
 }
 .wrap{max-width:960px;margin:0 auto}
 h1{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
 .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
 .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.5;box-shadow:0 0 8px currentColor}
 .dot.on{background:var(--green);color:var(--green);opacity:1}
 .dot.off{background:var(--amber);color:var(--amber);opacity:1}

 .card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
 .card h2{font-size:14px;margin:0 0 12px;color:var(--cyan);letter-spacing:.04em}

 .banner{display:none;background:rgba(255,107,107,0.12);border:1px solid rgba(255,107,107,0.4);
   color:#ffb4b4;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.6}
 .banner.show{display:block}

 .hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6}
 .hint code{background:#06101c;padding:1px 5px;border-radius:5px;color:var(--cyan)}

 .bar{display:flex;gap:10px;margin-bottom:12px}
 button{
   background:linear-gradient(135deg,var(--blue),var(--cyan));color:#04121f;border:0;
   padding:9px 15px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
 }
 button:active{transform:translateY(1px)}

 .post{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#06101c}
 .post .meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
 .post .author{color:var(--cyan);font-weight:600}
 .post .body{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--text)}
 .post a{color:var(--blue);text-decoration:none;font-size:12px}
 .post a:hover{text-decoration:underline}
 .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0}
 .statusline{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
 .statusline b{color:var(--text)}
 .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0a1626;border:1px solid var(--line-strong);
   color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
 .toast.show{opacity:1}
 .start code{display:block;background:#06101c;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
   color:var(--cyan);font-size:13px;margin:8px 0;word-break:break-all;font-family:"SFMono-Regular",Consolas,monospace}
 .pill{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px;margin-left:8px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <!-- 纯展示页：监控/推送由后端执行，本页只显示大佬最近发言 -->
</div>
<div class="toast" id="toast"></div>

<script>
(async function(){
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const DEFAULT_PORT = 8765;
  const portParam = new URLSearchParams(location.search).get('port') || DEFAULT_PORT;
  let BACKEND = '';
  let ONLINE = false;

  // 后端地址解析：优先同源（被后端直接托管），否则指向本地端口
  async function resolveBackend(){
    try{
      const r = await fetch('/api/status', {mode:'cors'});
      if(r.ok){ const j = await r.json(); if(j && ('monitor_enabled' in j)) return ''; }
    }catch(e){}
    return 'http://localhost:' + portParam;
  }

  async function api(path, opts){
    const r = await fetch(BACKEND + path, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{}));
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }

  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(()=>toastEl.classList.remove('show'), 2600);
  }
  function el(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
  function escapeHtml(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function fmt(ts){ return ts ? new Date(ts*1000).toLocaleString() : '—'; }

  function copyText(t){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(()=>toast('已复制启动命令')).catch(()=>fallbackCopy(t));
    } else fallbackCopy(t);
  }
  function fallbackCopy(t){
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy'); toast('已复制启动命令');}catch(e){ toast('请手动复制'); }
    document.body.removeChild(ta);
  }

  // 由 file:// 页面推导启动命令（复制后 cmd / PowerShell 通用，无需 cd、无 &&）
  function buildStartCmd(){
    if(!/^file:/i.test(location.protocol)) return null;
    let p = decodeURIComponent(location.href);
    p = p.replace(/^file:\/\//i, '');
    if (p.startsWith('/') && /^[A-Za-z]:/.test(p.slice(1))) p = p.slice(1);
    p = p.replace(/[\\/]+$/, '');
    const pagesDir = p.replace(/[\\/][^\\/]*$/, '');
    const repoDir = pagesDir.replace(/[\\/][^\\/]*$/, '');
    const isWin = /Win/i.test(navigator.platform) || /Windows/i.test(navigator.userAgent);
    const scriptPath = repoDir + (isWin ? '\\monitor\\nga_monitor.py' : '/monitor/nga_monitor.py');
    return isWin ? `python "${scriptPath}"` : `python3 "${scriptPath}"`;
  }

  // ============ 渲染骨架 ============
  function renderSkeleton(){
    app.innerHTML = '';
    const h1 = el('h1');
    h1.appendChild(el('span','dot off')); h1.firstChild.id='dot';
    h1.appendChild(el('span',null,'NGA 大佬监控'));
    h1.appendChild(el('span','pill', '全天候运行 · 24h'));
    app.appendChild(h1);
    app.appendChild(el('div','sub','大佬最近发言实时展示 —— 抓取、检测与企微推送均由后端 24 小时运行，本页只负责查看。'));
    const banner = el('div','banner'); banner.id='banner'; app.appendChild(banner);
    const status = el('div','statusline'); status.id='status'; app.appendChild(status);

    const bar = el('div','bar'); bar.id='bar';
    const refreshBtn = el('button',null,'🔄 立即刷新');
    refreshBtn.addEventListener('click', refresh);
    bar.appendChild(refreshBtn);
    app.appendChild(bar);

    const pc = el('div','card');
    pc.appendChild(el('h2',null,'📜 大佬最近发言'));
    const list = el('div'); list.id='list';
    list.innerHTML = '<div class="empty">正在连接监控后端…</div>';
    pc.appendChild(list);
    app.appendChild(pc);
  }

  function setDot(on){ const d=document.getElementById('dot'); if(d) d.className='dot '+(on?'on':'off'); }

  // 离线：显示启动指引卡（仅启动后端用，不含任何监控配置）
  function renderOffline(){
    if(document.getElementById('startcard')) return;
    const sc = el('div','card start'); sc.id='startcard';
    sc.appendChild(el('h2',null,'🚀 监控后端未运行'));
    sc.appendChild(el('div','hint','本页只展示发言，监控与企微推送由后端脚本执行。请先启动后端：'));
    const cmd = buildStartCmd() || 'python "你的项目路径/intraday-monitor/monitor/nga_monitor.py"';
    const code = el('code'); code.textContent = cmd; sc.appendChild(code);
    const btns = el('div','bar');
    const copy = el('button',null,'📋 复制启动命令');
    copy.addEventListener('click', ()=>copyText(cmd));
    btns.appendChild(copy);
    sc.appendChild(btns);
    sc.appendChild(el('div','hint','监控目标（帖子ID / 作者ID）与 NGA 登录 ID 在 <code>monitor/nga_config.json</code> 中配置，修改后需重启脚本生效。'));
    const bar = document.getElementById('bar');
    app.insertBefore(sc, bar);
  }

  function removeOffline(){ const s=document.getElementById('startcard'); if(s) s.remove(); }

  // ============ 连接 ============
  async function connect(){
    BACKEND = await resolveBackend();
    try{
      await api('/api/status');
      ONLINE = true;
      setDot(true);
      removeOffline();
      refresh();
    }catch(e){
      ONLINE = false;
      setDot(false);
      renderOffline();
    }
  }

  // ============ 展示（只读，不配置、不自动轮询） ============
  async function refresh(){
    if(!ONLINE){
      const list=document.getElementById('list');
      if(list) list.innerHTML='<div class="empty">尚未连接后端。请启动监控后端（见上方卡片）后点「立即刷新」。</div>';
      return;
    }
    try{
      const data = await api('/api/posts');
      const st = data.status||{};
      const banner = document.getElementById('banner');
      if(st.last_error){
        banner.classList.add('show');
        banner.innerHTML = '⚠️ '+escapeHtml(st.last_error);
      } else { banner.classList.remove('show'); }

      setDot(st.monitor_enabled!==false);
      const status=document.getElementById('status');
      if(status){
        const tids=(st.tids||[]).join(', ');
        const aids=(st.authorids||[]).join(', ');
        status.innerHTML =
          `<span>监控目标：tid <b>${escapeHtml(tids)}</b> / 作者 <b>${escapeHtml(aids)}</b></span>`+
          `<span>推送：<b style="color:${st.monitor_enabled!==false?'var(--green)':'var(--amber)'}">${st.monitor_enabled!==false?'开启':'关闭'}</b></span>`+
          `<span>最近检查：${fmt(st.last_check)}</span>`+
          `<span>上次推送：${fmt(st.last_push)}</span>`+
          `<span>缓存：${st.cached} 条</span>`+
          `<span>NGA登录：${st.has_cookie?'已填':'未填'}</span>`;
      }
      renderPosts(data.posts||[]);
    }catch(e){
      const list=document.getElementById('list');
      if(list) list.innerHTML='<div class="empty">无法连接后端，请确认监控后端已运行（见上方启动指引）。</div>';
    }
  }

  function renderPosts(posts){
    const list=document.getElementById('list'); list.innerHTML='';
    if(!posts.length){
      list.innerHTML='<div class="empty">暂无发言数据。请确认 NGA 登录 ID 已配置、监控目标正确，然后点「立即刷新」。</div>';
      return;
    }
    posts.forEach(p=>{
      const card = el('div','post');
      const meta = el('div','meta');
      const left = el('span');
      left.appendChild(el('span','author', p.author||('UID '+p.authorid)));
      left.appendChild(document.createTextNode('  ·  UID '+p.authorid+'  ·  tid '+p.tid));
      meta.appendChild(left);
      meta.appendChild(el('span',null, p.time||''));
      card.appendChild(meta);
      const body = el('div','body'); body.textContent = p.content_text || p.content || '(无内容)';
      card.appendChild(body);
      const foot = el('div'); foot.style.marginTop='6px';
      const link = el('a',null,'在 NGA 查看 →'); link.href = p.url||'#'; link.target='_blank'; link.rel='noopener';
      foot.appendChild(link);
      card.appendChild(foot);
      list.appendChild(card);
    });
  }

  renderSkeleton();
  connect();
})();
</script>
</body>
</html>
