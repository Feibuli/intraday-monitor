<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盘中监控台</title>
<style>
 :root{
   --bg:#06101c; --bg-side:#0a1626;
   --line:rgba(125,154,211,0.18); --line-strong:rgba(125,154,211,0.32);
   --text:#e8f1ff; --muted:#90a7cf;
   --blue:#5fa8ff; --cyan:#39d9ff; --green:#2bd67b; --amber:#ffb85c;
   --side-w:220px;
 }
 *{box-sizing:border-box}
 html,body{height:100%;margin:0}
 body{
   color:var(--text);
   font-family:"Inter","PingFang SC","Microsoft YaHei",sans-serif;
   background:linear-gradient(180deg,#06101c 0%,#08111f 44%,#091522 100%);
   overflow:hidden;
 }
 .app{display:flex;height:100vh;width:100vw}

 /* 侧边栏 */
 .side{
   width:var(--side-w);flex-shrink:0;height:100%;
   background:linear-gradient(180deg,#0a1626 0%,#08111f 100%);
   border-right:1px solid var(--line);
   display:flex;flex-direction:column;
 }
 .side .brand{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
 .side .brand .logo{display:flex;align-items:center;gap:10px}
 .side .brand .logo .dot{
   width:10px;height:10px;border-radius:50%;
   background:linear-gradient(135deg,var(--cyan),var(--blue));
   box-shadow:0 0 12px var(--cyan);
 }
 .side .brand h1{margin:0;font-size:17px;letter-spacing:.04em;font-weight:600}
 .side .brand p{margin:6px 0 0;color:var(--muted);font-size:11px}

 .nav{flex:1;overflow-y:auto;padding:12px 10px}
 .nav-item{
   display:flex;align-items:center;gap:11px;
   padding:11px 14px;margin:3px 0;border-radius:12px;
   color:var(--muted);cursor:pointer;font-size:14px;
   transition:all .18s ease;border:1px solid transparent;user-select:none;
 }
 .nav-item .icon{font-size:17px;line-height:1;width:20px;text-align:center}
 .nav-item:hover{background:rgba(95,168,255,0.08);color:var(--text)}
 .nav-item.active{
   background:linear-gradient(135deg,rgba(95,168,255,0.18),rgba(57,217,255,0.10));
   color:var(--text);border-color:var(--line-strong);
   box-shadow:0 6px 20px rgba(57,217,255,0.10);
 }

 .side .foot{
   padding:12px 18px;border-top:1px solid var(--line);
   color:var(--muted);font-size:11px;display:flex;justify-content:space-between;align-items:center;
 }
 .side .foot .clock{font-variant-numeric:tabular-nums;color:var(--cyan)}

 /* 主区域 */
 .main{flex:1;height:100%;position:relative;overflow:hidden}
 .frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:transparent}
 .frame.active{display:block}

 .empty{
   position:absolute;inset:0;display:none;flex-direction:column;
   align-items:center;justify-content:center;color:var(--muted);gap:10px;
 }
 .empty.show{display:flex}

 .nav::-webkit-scrollbar{width:6px}
 .nav::-webkit-scrollbar-thumb{background:rgba(125,154,211,0.25);border-radius:3px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="dot"></span><h1>盘中监控台</h1></div>
      <p>Intraday Monitor · 多页面聚合</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <span>本地时间</span><span class="clock" id="clock">--:--:--</span>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script src="config.js"></script>
<script>
(function(){
  const nav  = document.getElementById('nav');
  const main = document.getElementById('main');
  const pages = (typeof PAGES !== 'undefined' && Array.isArray(PAGES)) ? PAGES : [];

  pages.forEach((p, i) => {
    // 侧边栏导航项
    const item = document.createElement('div');
    item.className = 'nav-item' + (i === 0 ? ' active' : '');
    item.dataset.id = p.id;
    item.innerHTML =
      '<span class="icon">' + (p.icon || '◆') + '</span>' +
      '<span class="name">' + (p.name || p.id) + '</span>';
    item.addEventListener('click', function(){ activate(p.id); });
    nav.appendChild(item);

    // 预加载 iframe（display 切换，保留各页面状态）
    const f = document.createElement('iframe');
    f.className = 'frame' + (i === 0 ? ' active' : '');
    f.dataset.id = p.id;
    f.src = p.src;
    f.setAttribute('allowfullscreen', '');
    main.appendChild(f);
  });

  if (!pages.length){
    const e = document.createElement('div');
    e.className = 'empty show';
    e.innerHTML =
      '<div style="font-size:42px">空的</div>' +
      '<div>未配置任何页面</div>' +
      '<div style="font-size:12px">请在 config.js 的 PAGES 中添加页面</div>';
    main.appendChild(e);
  }

  function activate(id){
    document.querySelectorAll('.nav-item').forEach(function(el){
      el.classList.toggle('active', el.dataset.id === id);
    });
    document.querySelectorAll('.frame').forEach(function(el){
      el.classList.toggle('active', el.dataset.id === id);
    });
  }

  // 底部时钟
  const clock = document.getElementById('clock');
  function tick(){
    const d = new Date();
    const p = function(n){ return String(n).padStart(2, '0'); };
    clock.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
